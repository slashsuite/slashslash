name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      # moon diffs the head against the base branch before any task runs, even for a plain
      # `moon run`, and the checkout has no local `main`, so it names the remote ref. That needs the
      # full history (fetch-depth: 0 below).
      MOON_BASE: origin/main
      # Reads the shared moon cache: moon downloads hits, and the host refuses its uploads. A fork's
      # pull request gets no secrets, so moon logs a 401 and runs everything locally.
      MOON_REMOTE_TOKEN: ${{ secrets.MOON_CACHE_READ_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bunx moon run --concurrency 3 :lint :typecheck :build :test
      # The page loop in a real browser: every page on a Chromium desktop and a Chromium phone.
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/site
      - run: bunx moon run site:e2e
      # A failed run keeps the HTML report and each failed test's trace (the config retains them on
      # failure), so a CI-only failure can be read without reproducing it.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/site/playwright-report/
            apps/site/test-results/
          retention-days: 14
