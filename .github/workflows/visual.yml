name: Visual

# The site's visual check: builds the site, shoots every page in the sitemap plus the 404 page, in
# Slash Day and Slash Night, on a desktop and a phone (apps/site/pixelslash.config.ts), and uploads
# the shots to the slashslash-site project on the PixelSlash server, which diffs them against main.
# The server's address is the PIXELSLASH_SERVER secret, so it is never written in this repo. A pull
# request uploads its head commit on its own branch; a push to main uploads main, which the server
# takes as the new baseline. It uses the plain `pull_request` trigger, so a pull request without the
# secrets (a fork's, or any before the secrets are set) skips with a notice and passes. Never switch
# it to `pull_request_target`: this job runs the pull request's code with the token in its env.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Only the newest push on a ref matters: the server diffs a branch against the newest main build
# among its ancestors.
concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    runs-on: ubuntu-latest
    env:
      PIXELSLASH_TOKEN: ${{ secrets.PIXELSLASH_TOKEN }}
    steps:
      - name: Check for the PixelSlash token
        if: env.PIXELSLASH_TOKEN == ''
        run: echo "::notice::The visual check needs the PIXELSLASH_TOKEN and PIXELSLASH_SERVER secrets, so it was skipped."

      # The pull request's head commit, never GitHub's synthetic merge commit: the server keys the
      # build on the commit it was given. Full history, since the upload finds the merge-base with
      # origin/main and walks main's builds.
      - name: Check out slashslash
        if: env.PIXELSLASH_TOKEN != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: slashslash
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # The upload runs the PixelSlash CLI from this checkout, beside slashslash. It runs with the token
      # in its env, so it is pinned to a commit (pixelslash main, 2026-11-25), never a branch, and is
      # bumped by hand: apps/site/pixelslash.sha (the docs the site shows) moves on its own and this
      # does not follow it.
      - name: Check out pixelslash
        if: env.PIXELSLASH_TOKEN != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: slashsuite/pixelslash
          ref: 74182377e4e3940b50a1dbf17b4bc2d6f546c2e9
          path: pixelslash
          persist-credentials: false

      - name: Set up Bun
        if: env.PIXELSLASH_TOKEN != ''
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: slashslash/.bun-version

      - name: Install slashslash
        if: env.PIXELSLASH_TOKEN != ''
        working-directory: slashslash
        run: bun install --frozen-lockfile

      - name: Install pixelslash
        if: env.PIXELSLASH_TOKEN != ''
        working-directory: pixelslash
        run: bun install --frozen-lockfile

      # The browser the capture launches: pixelslash's engine declares the Playwright version, so the
      # browser is installed from there, not from the site's lockfile.
      - name: Install Chromium for the capture
        if: env.PIXELSLASH_TOKEN != ''
        working-directory: pixelslash/packages/engine
        run: bunx playwright install --with-deps chromium

      # MOON_BASE is HEAD: moon diffs against a base before any task runs, and HEAD needs no ref.
      - name: Build the site
        if: env.PIXELSLASH_TOKEN != ''
        working-directory: slashslash
        env:
          MOON_BASE: HEAD
        run: bunx moon run site:build

      # Run from apps/site, so the config's `astro preview` serves the build there. The CLI names the
      # branch from GITHUB_HEAD_REF (a pull request) or GITHUB_REF_NAME (main), so the detached
      # checkout needs no local branch.
      - name: Upload the visual check
        if: env.PIXELSLASH_TOKEN != ''
        working-directory: slashslash/apps/site
        env:
          PIXELSLASH_SERVER: ${{ secrets.PIXELSLASH_SERVER }}
        run: bun "$GITHUB_WORKSPACE/pixelslash/packages/cli/src/index.ts" capture --upload --config pixelslash.config.ts
