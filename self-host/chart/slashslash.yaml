# Rendered from self-host/chart for installs without Helm: `bun self-host/chart.ts --write`.
# It expects the namespace slashslash and a Secret slashslash-github (see chart/README.md).
---
# Source: slashslash/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: slashslash
  namespace: slashslash
  labels:
    app.kubernetes.io/name: slashslash
    app.kubernetes.io/instance: slashslash
    app.kubernetes.io/version: "0.1.3"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: slashslash-0.1.3
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: slashslash
    app.kubernetes.io/instance: slashslash
  ports:
    - name: pixelslash
      port: 3000
      targetPort: pixelslash
    - name: toggleslash
      port: 8080
      targetPort: toggleslash

---
# Source: slashslash/templates/statefulset.yaml
# One pod, always: both tools keep SQLite on the volume, and one SQLite file takes one writer. With
# one replica a StatefulSet's rolling update deletes the old pod before it makes the new one, so two
# pods never share the volume.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: slashslash
  namespace: slashslash
  labels:
    app.kubernetes.io/name: slashslash
    app.kubernetes.io/instance: slashslash
    app.kubernetes.io/version: "0.1.3"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: slashslash-0.1.3
spec:
  replicas: 1
  serviceName: slashslash
  selector:
    matchLabels:
      app.kubernetes.io/name: slashslash
      app.kubernetes.io/instance: slashslash
  template:
    metadata:
      labels:
        app.kubernetes.io/name: slashslash
        app.kubernetes.io/instance: slashslash
        app.kubernetes.io/version: "0.1.3"
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: slashslash-0.1.3
    spec:
      # The image takes its own settings from the environment (SLASHSLASH_PORT among them), so
      # Kubernetes must not add a variable for every Service in the namespace.
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: slashslash
          image: "ghcr.io/slashsuite/slashslash:0.1.3"
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: slashslash-github
          env:
            # The /run emptyDir belongs to root with mode 2777 (group 1654 from fsGroup), which the
            # supervisor refuses as a non-root user unless told this is Kubernetes. Nothing but the
            # container's one user can reach it.
            - name: S6_YES_I_WANT_A_WORLD_WRITABLE_RUN_BECAUSE_KUBERNETES
              value: "1"
          ports:
            - name: pixelslash
              containerPort: 3000
            - name: toggleslash
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # The first start migrates PixelSlash's database, and an upgrade backs up the volume, before
          # PixelSlash listens.
          startupProbe:
            httpGet:
              path: /
              port: pixelslash
            periodSeconds: 5
            failureThreshold: 36
          # The image's own check asks both tools through its front door.
          readinessProbe:
            exec:
              command: [/usr/local/bin/healthcheck]
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: [/usr/local/bin/healthcheck]
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          # The only places the container writes.
          volumeMounts:
            - name: data
              mountPath: /data
            - name: run
              mountPath: /run
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/app
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: slashslash
          app.kubernetes.io/instance: slashslash
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 8Gi
